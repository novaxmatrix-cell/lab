<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&display=block">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:"IBM Plex Sans Arabic",sans-serif;color:#F2F4FA;position:relative;
  background:radial-gradient(60% 45% at 50% 0,#232F69,transparent 100%),linear-gradient(180deg,#090D27 30%,#060818)}
.stars{position:absolute;inset:0;opacity:.6;background-image:
  radial-gradient(2px 2px at 8% 12%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 22% 30%,#cfe0ff 50%,transparent 51%),
  radial-gradient(2px 2px at 35% 8%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 48% 22%,#fff 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 12% 62%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 94% 10%,#fff 50%,transparent 51%)}
.txt{position:absolute;right:90px;top:120px;width:600px}
h1{font-size:136px;line-height:1.05;font-weight:700;color:#FFCF6B}
h1 small{display:block;font-size:38px;color:#8488A0;font-weight:400;letter-spacing:.08em;margin-top:8px}
p{font-size:38px;line-height:1.5;margin-top:26px;color:#F2F4FA;text-wrap:balance}
.url{font-size:26px;color:#7AA2FF;margin-top:22px;direction:ltr;text-align:right}
.tower{position:absolute;left:130px;bottom:44px;width:300px;display:flex;flex-direction:column;gap:12px}
.roof{height:56px;margin:0 -10px -4px;background:#141A38;clip-path:polygon(50% 0,100% 100%,0 100%)}
.fl{position:relative;height:50px;border-radius:10px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:20px;font-weight:700}
.g{background:linear-gradient(270deg,#FED786,#F6B946);color:#2A1800}
.c{background:#0F1640;color:#fff;outline:3px solid #7AA2FF;outline-offset:6px;box-shadow:0 0 30px 6px rgba(122,162,255,.45)}
.l{background:#141A38;color:#5F6688;border:1.5px dashed #1F2858;font-weight:400}
</style>
</head>
<body>
<div class="stars"></div>
<div class="tower">
  <div class="roof"></div>
  <div class="fl l"><span>الطابق 7</span><span>مقفل</span></div>
  <div class="fl l"><span>الطابق 6</span><span>مقفل</span></div>
  <div class="fl c"><span>الطابق 5</span><span>أنت هنا</span></div>
  <div class="fl g"><span>الطابق 4</span><span>✓</span></div>
  <div class="fl g"><span>الطابق 3</span><span>✓</span></div>
  <div class="fl g"><span>الطابق 2</span><span>✓</span></div>
  <div class="fl g"><span>الطابق 1</span><span>✓</span></div>
</div>
<div class="txt">
  <h1>البرج<small>BURJ</small></h1>
  <p>كل جواب صحيح يفتح الطابق التالي. هل تصل القمة قبل أصدقائك؟</p>
  <div class="url">lab.novaxmatrix.com/burj</div>
</div>
</body>
</html>
