<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaX Lab | تجارب وأفكار جديدة</title>
<meta name="description" content="NovaX Lab: تجارب وأفكار جديدة من NovaX Matrix. أولها البرج، لغز عربي يومي.">

<meta property="og:type" content="website">
<meta property="og:site_name" content="NovaX Lab">
<meta property="og:title" content="NovaX Lab">
<meta property="og:description" content="تجارب وأفكار جديدة من NovaX Matrix. أولها البرج، لغز عربي يومي.">
<meta property="og:url" content="https://lab.novaxmatrix.com/">
<meta property="og:image" content="https://lab.novaxmatrix.com/burj/og.png">
<meta property="og:locale" content="ar_AR">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap"></noscript>
<style>
:root{--font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
 --p:#7EAAFF;--a:#3CC8F5;--bg:#0A0F1A;--s:#111827;--s2:#0E1522;--b:#222D40;--t:#E7ECF4;--m:#A0ACBF;--navy:#070C17;--navy2:#0F1B33;--gold:#F5C451;
 --r-lg:16px;--r-xl:22px;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);font-size:1.0625rem;background:var(--bg);color:var(--t);line-height:1.75;overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:960px;margin:0 auto;padding:0 16px}
header{padding:20px 0}
header .wrap{display:flex;align-items:center;justify-content:space-between}
.brand{display:inline-flex;align-items:center;gap:10px;color:var(--t);text-decoration:none;font-weight:700;font-size:1.25rem;direction:ltr}
.brand .ic{width:36px;height:36px;border-radius:10px;background:radial-gradient(70% 70% at 50% 40%,var(--navy2),var(--navy));border:1px solid color-mix(in srgb,var(--p) 20%,transparent);display:flex;align-items:center;justify-content:center;color:var(--p)}
.brand span{font-weight:400;color:var(--m)}
.back{color:var(--m);text-decoration:none;font-size:.9375rem}
.back:hover{color:var(--t)}
.hero{position:relative;text-align:center;padding:56px 0 40px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto;height:420px;background:radial-gradient(48% 60% at 50% 0%,color-mix(in srgb,var(--p) 12%,transparent),transparent 70%);pointer-events:none}
.kicker{display:block;font-size:.8125rem;font-weight:700;color:var(--p);margin-bottom:6px;position:relative}
h1{position:relative;font-size:clamp(2.125rem,1.3rem + 3.6vw,3.5rem);line-height:1.1;letter-spacing:-.02em;direction:ltr;margin-bottom:14px}
h1 span{font-weight:400;color:var(--m)}
.lead{position:relative;color:var(--m);font-size:1.1875rem;max-width:30em;margin:0 auto}
main{flex:1}
.grid{display:grid;gap:20px;padding-bottom:56px}
.card{position:relative;display:flex;gap:20px;align-items:center;background:var(--s);border:1px solid var(--b);border-radius:var(--r-xl);padding:24px;color:var(--t);text-decoration:none;overflow:hidden;transition:border-color .2s,transform .2s}
.card::after{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--gold),var(--a))}
.card:hover{border-color:var(--p);transform:translateY(-2px)}
.card img{width:80px;height:80px;border-radius:18px;flex:none}
.card h2{font-size:1.5rem;line-height:1.3}
.card h2 small{font-size:.9375rem;color:var(--m);font-weight:400;margin-inline-start:8px}
.card p{color:var(--m);font-size:1rem}
.go{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-weight:700;font-size:.9375rem;color:var(--p)}
.soon{border-style:dashed;background:var(--s2);color:var(--m);justify-content:center;text-align:center;padding:28px}
.soon::after{display:none}
footer{border-top:1px solid var(--b);padding:20px 0;color:var(--m);font-size:.875rem}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--m);text-decoration:none}
footer a:hover{color:var(--t)}
footer .mark{width:18px;height:18px;fill:currentColor;align-self:center}
@media (max-width:420px){.card{flex-direction:column;align-items:flex-start;text-align:start}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="/"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"/><path d="M7.5 15h9"/></svg></span><b>NovaX</b> <span>Lab</span></a>
  <a class="back" href="https://novaxmatrix.com/ar/">NovaX Matrix</a>
</div></header>
<main>
  <section class="hero"><div class="wrap">
    <span class="kicker">مختبر NovaX Matrix</span>
    <h1>NovaX <span>Lab</span></h1>
    <p class="lead">تجارب وأفكار جديدة. صغيرة، سريعة، ومجانية.</p>
  </div></section>
  <section><div class="wrap grid">
    <a class="card" href="/burj/">
      <img src="/burj/icon.svg" width="80" height="80" alt="">
      <div>
        <h2>البرج<small>Burj</small></h2>
        <p>لغز عربي يومي. كل جواب صحيح يفتح الطابق التالي. هل تصل القمة قبل أصدقائك؟</p>
        <span class="go">العب الآن ←</span>
      </div>
    </a>
    <div class="card soon">تجارب أخرى قريباً</div>
  </div></section>
</main>
<footer><div class="wrap">
  <svg class="mark" viewBox="0 0 100 100" role="img" aria-label="NovaX Matrix"><title>NovaX Matrix</title><rect x="0" y="0" width="26" height="26" fill-opacity=".26"/><rect x="37" y="0" width="26" height="26" fill-opacity=".26"/><rect x="74" y="0" width="26" height="26" fill-opacity=".26"/><rect x="0" y="37" width="26" height="26" fill-opacity=".26"/><rect x="37" y="37" width="26" height="26" fill-opacity=".26"/><rect x="74" y="37" width="26" height="26" fill-opacity=".26"/><rect x="0" y="74" width="26" height="26"/><rect x="37" y="74" width="26" height="26" fill-opacity=".26"/><rect x="74" y="74" width="26" height="26" fill-opacity=".26"/></svg>
  <a href="https://novaxmatrix.com/ar/">novaxmatrix.com</a>
</div></footer>
</body>
</html>
